[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypid"
version = "0.7.2rc1"

requires-python = ">=3.10"
authors = [
  {name = "Alexander Steppke"},
]

description = "Tiny PID controller"
readme = "README.md"

license = "MIT" 
license-files = ["LICENSE"]

keywords = ["pid", "pid-controller", "control-theory", "control-systems", "feedback-control", "instrumentation"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "flake8"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=tinypid --cov-report=term-missing"

[tool.coverage.run]
source = ["tinypid"]

[tool.setuptools] 
packages = ["tinypid"]

[project.urls]
Homepage = "https://github.com/asteppke/tinypid"
Repository = "https://github.com/asteppke/tinypid"
"Bug Tracker" = "https://github.com/asteppke/tinypid/issues"


